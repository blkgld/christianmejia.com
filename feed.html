<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Bluesky | Christian Mejia</title>
  <meta name="description" content="Latest posts from Christian Mejia on Bluesky.">
  <meta name="author" content="Christian Mejia">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://christianmejia.com/feed.html">

  <!-- NOTE: there is intentionally NO Content-Security-Policy on this page.
       The home page CSP would block the Bluesky embed. -->
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="icon" href="/assets/images/cm_logo_og.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Open+Sans:wght@600&amp;display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Questrial&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/crispy.css">

  <script type="module" src="https://cdn.jsdelivr.net/npm/bsky-embed/dist/bsky-embed.es.js"></script>

  <style>
    .feed {
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
    }
    .feed h1 {
      margin-top: 0;
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  {% include header.html %}

  <main id="main">
    <section class="feed">
      <h1>Bluesky</h1>

      <bsky-embed
        username="mejiachris.bsky.social"
        mode="light"
        limit="10"
        link-target="_blank"
        link-image="true"
        load-more="true">
      </bsky-embed>
    </section>
  </main>

  {% include footer.html %}

  <script src="/js/year.js" defer></script>
