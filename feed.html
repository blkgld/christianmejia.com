<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bluesky</title>

  <!-- Load the embed library once -->
  <script type="module"
    src="https://cdn.jsdelivr.net/npm/bsky-embed/dist/bsky-embed.es.js"
    async></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
    }
    main {
      max-width: 600px;      /* keeps the feed a readable column */
      margin: 0 auto;
      padding: 2rem 1rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>My Bluesky Feed</h1>

    <bsky-embed
      username="mejiachris"
      mode="dark"
      limit="10"
      link-target="_blank"
      link-image="true"
      load-more="true">
    </bsky-embed>
  </main>
</body>
</html>
